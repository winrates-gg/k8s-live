environment: production

backend:
  workerImage:
    repository: 152088127544.dkr.ecr.us-east-2.amazonaws.com/wrgg-production-backend-worker
    pullPolicy: IfNotPresent
  config:
    ndLogLevel: "0"

archiveReconcileCronjobs:
  - name: match-archive-reconcile
    schedule: "30 6 * * 0"
    module: workers.match_archive_reconcile
  - name: match-archive-cleanup
    schedule: "0 */6 * * *"
    module: workers.match_archive_cleanup

analyticsCronjobs:
  - name: tier-cohort-win-rate
    schedule: "15 4 * * *"
    module: workers.tier_cohort_win_rate
