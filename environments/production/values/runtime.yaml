environment: production

deploymentScope:
  releaseStage: na-beta
  platforms:
    na1: americas

backend:
  apiImage:
    repository: 152088127544.dkr.ecr.us-east-2.amazonaws.com/wrgg-production-backend-api
    pullPolicy: IfNotPresent
  workerImage:
    repository: 152088127544.dkr.ecr.us-east-2.amazonaws.com/wrgg-production-backend-worker
    pullPolicy: IfNotPresent
  ingress:
    host: api.winrates.gg
  secrets:
    databaseUrl: 'postgresql+asyncpg://wrgg_app_role:{{ .pg_password }}@wrgg-production-control-plane:5432/wrgg_production'
    databaseUrlForAlembic: 'postgresql://wrgg_app_role:{{ .pg_password }}@wrgg-production-control-plane:5432/wrgg_production'
    postgresPasswordSsmPath: /wrgg/production/seeded/control_plane/cluster/eso/runtime/postgres/wrgg_app_role/password
    riotApiKeySsmPath: /wrgg/production/seeded/control_plane/cluster/eso/runtime/riot/api_key
  config:
    ndLogLevel: "0"
    matchArchiveRetentionDays: "90"
    matchArchiveCleanupBatchSize: "500"
    matchArchiveCleanupMaxRows: "5000"
