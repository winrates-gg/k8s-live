environment: staging

deploymentScope:
  releaseStage: na-beta
  platforms:
    na1: americas

backend:
  apiImage:
    repository: 124188344567.dkr.ecr.us-east-2.amazonaws.com/wrgg-staging-backend-api
    pullPolicy: IfNotPresent
  workerImage:
    repository: 124188344567.dkr.ecr.us-east-2.amazonaws.com/wrgg-staging-backend-worker
    pullPolicy: IfNotPresent
  ingress:
    host: api.staging.winrates.gg
  config:
    ndLogLevel: "3"
    matchArchiveRetentionDays: "60"
    matchArchiveCleanupBatchSize: "500"
    matchArchiveCleanupMaxRows: "5000"
