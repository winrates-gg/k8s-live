apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: wrgg-environment-apps
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions:
    - missingkey=error
  generators:
    - matrix:
        generators:
          # The environment overlay replaces this generator path with exactly
          # one environment and its currently deployed release pointer.
          - git:
              repoURL: https://github.com/winrates-gg/k8s-live.git
              revision: main
              files:
                - path: ci/releases/current/*.yaml
          - list:
              elements:
                - component: bootstrap
                  applicationName: wrgg-bootstrap
                  chartPath: charts/bootstrap
                  helmReleaseName: wrgg-bootstrap
                  syncWave: "0"
                - component: runtime
                  applicationName: winrates-gg-runtime
                  chartPath: charts/runtime
                  helmReleaseName: winrates-gg-runtime
                  syncWave: "1"
                - component: reconcile
                  applicationName: winrates-gg-reconcile
                  chartPath: charts/reconcile
                  helmReleaseName: winrates-gg-reconcile
                  syncWave: "2"
  template:
    metadata:
      name: "{{ .applicationName }}"
      namespace: argocd
      annotations:
        argocd.argoproj.io/sync-wave: "{{ .syncWave }}"
    spec:
      project: default
      sources:
        - repoURL: https://github.com/winrates-gg/k8s-helm-charts.git
          targetRevision: "{{ .chartRevision }}"
          path: "{{ .chartPath }}"
          helm:
            releaseName: "{{ .helmReleaseName }}"
            valueFiles:
              - "$values/environments/{{ .environment }}/values/{{ .component }}.yaml"
              - "$values/ci/releases/candidates/{{ .clusterCandidateId }}.yaml"
        - repoURL: https://github.com/winrates-gg/k8s-live.git
          targetRevision: "{{ .k8sLiveRevision }}"
          ref: values
      destination:
        server: https://kubernetes.default.svc
        namespace: "{{ if eq .component \"bootstrap\" }}argocd{{ else }}{{ .environment }}{{ end }}"
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
          - SkipDryRunOnMissingResource=true
