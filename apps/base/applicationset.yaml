apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: wrgg-environment-apps
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions:
    - missingkey=error
  generators:
    - git:
        repoURL: https://github.com/winrates-gg/k8s-live.git
        revision: main
        files:
          - path: deployments/*.yaml
  template:
    metadata:
      name: winrates-gg-runtime
      namespace: argocd
      annotations:
        argocd.argoproj.io/sync-wave: "1"
    spec:
      project: default
      sources:
        - repoURL: https://github.com/winrates-gg/k8s-helm-charts.git
          targetRevision: "{{ .chartRelease }}"
          path: charts/init
          helm:
            releaseName: wrgg-init
            valueFiles:
              - "$values/environments/{{ .environment }}/values/init.yaml"
              - "$values/deployments/{{ .environment }}.yaml"
        - repoURL: https://github.com/winrates-gg/k8s-helm-charts.git
          targetRevision: "{{ .chartRelease }}"
          path: charts/runtime
          helm:
            releaseName: winrates-gg-runtime
            valueFiles:
              - "$values/environments/{{ .environment }}/values/runtime.yaml"
              - "$values/deployments/{{ .environment }}.yaml"
        - repoURL: https://github.com/winrates-gg/k8s-live.git
          targetRevision: "{{ .k8sLiveRelease }}"
          ref: values
      destination:
        server: https://kubernetes.default.svc
        namespace: "{{ .environment }}"
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        retry:
          limit: 3
          backoff:
            duration: 10s
            factor: 2
            maxDuration: 2m
        syncOptions:
          - CreateNamespace=true
          - SkipDryRunOnMissingResource=true
