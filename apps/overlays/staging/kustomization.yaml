apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
patches:
  - target:
      group: argoproj.io
      version: v1alpha1
      kind: ApplicationSet
      name: wrgg-environment-apps
    patch: |-
      - op: replace
        path: /spec/generators/0/matrix/generators/0/git/files/0/path
        value: deployments/staging.yaml
