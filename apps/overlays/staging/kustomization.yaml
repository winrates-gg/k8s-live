apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
patches:
  - target:
      group: argoproj.io
      version: v1alpha1
      kind: ApplicationSet
      name: wrgg-environment-apps
    patch: |-
      - op: replace
        path: /spec/generators/0/matrix/generators/0/list/elements
        value:
          - environment: staging
            backendReleaseId: v1.2.2
            frontendReleaseId: v1.2.2
            chartRevision: 4189e43d59fbb6cad9239ee2bc3f4f18c89cb6da
