name: "[MNL] Deploy Cluster Candidate"

on:
  workflow_dispatch:
    inputs:
      operation:
        description: "Create a staging cluster candidate or promote an existing one"
        required: true
        type: choice
        options:
          - stage
          - promote
      cluster_version:
        description: "Recorded cluster candidate, for example cluster-v0.0.1"
        required: true
        type: string
      backend_candidate_id:
        description: "Backend candidate ID when staging, for example backend-v0.0.1"
        required: false
        type: string
      frontend_candidate_id:
        description: "Frontend candidate ID when staging, for example frontend-v0.0.1"
        required: false
        type: string
      chart_candidate_id:
        description: "Validated Helm candidate, for example chart-v0.0.1"
        required: false
        type: string

concurrency:
  group: cluster-release-ledger
  cancel-in-progress: false

jobs:
  deploy:
    name: ${{ inputs.operation }} cluster candidate
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Validate inputs
        run: |
          [[ "${{ inputs.cluster_version }}" =~ ^cluster-v[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "cluster_version must look like cluster-v1.2.3" >&2
            exit 1
          }
          if [[ "${{ inputs.operation }}" == "stage" ]]; then
            [[ "${{ inputs.backend_candidate_id }}" =~ ^backend-v[0-9]+\.[0-9]+\.[0-9]+$ ]] || exit 1
            [[ "${{ inputs.frontend_candidate_id }}" =~ ^frontend-v[0-9]+\.[0-9]+\.[0-9]+$ ]] || exit 1
            [[ "${{ inputs.chart_candidate_id }}" =~ ^chart-v[0-9]+\.[0-9]+\.[0-9]+$ ]] || exit 1
          fi

      - name: Create GitHub App token for release ledgers
        id: app_token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.WRGG_GITOPS_WRITE_APP_ID }}
          private-key: ${{ secrets.WRGG_GITOPS_WRITE_APP_PRIVATE_KEY }}
          owner: winrates-gg
          repositories: backend,frontend,k8s-live,k8s-helm-charts

      - name: Check out cluster ledger
        uses: actions/checkout@v4
        with:
          token: ${{ steps.app_token.outputs.token }}

      - name: Check out backend ledger
        uses: actions/checkout@v4
        with:
          repository: winrates-gg/backend
          ref: main
          token: ${{ steps.app_token.outputs.token }}
          path: backend

      - name: Check out frontend ledger
        uses: actions/checkout@v4
        with:
          repository: winrates-gg/frontend
          ref: main
          token: ${{ steps.app_token.outputs.token }}
          path: frontend

      - name: Check out Helm chart ledger
        uses: actions/checkout@v4
        with:
          repository: winrates-gg/k8s-helm-charts
          ref: main
          token: ${{ steps.app_token.outputs.token }}
          path: helm

      - name: Create staging cluster candidate
        if: ${{ inputs.operation == 'stage' }}
        run: |
          [[ "${{ inputs.cluster_version }}" =~ ^cluster-v[0-9]+\.[0-9]+\.[0-9]+$ ]] || exit 1
          [[ "${{ inputs.backend_candidate_id }}" =~ ^backend-v[0-9]+\.[0-9]+\.[0-9]+$ ]] || exit 1
          [[ "${{ inputs.frontend_candidate_id }}" =~ ^frontend-v[0-9]+\.[0-9]+\.[0-9]+$ ]] || exit 1
          [[ "${{ inputs.chart_candidate_id }}" =~ ^chart-v[0-9]+\.[0-9]+\.[0-9]+$ ]] || exit 1
          backend_file="backend/ci/releases/candidates/${{ inputs.backend_candidate_id }}.yaml"
          frontend_file="frontend/ci/releases/candidates/${{ inputs.frontend_candidate_id }}.yaml"
          chart_file="helm/ci/releases/candidates/${{ inputs.chart_candidate_id }}.yaml"
          test -f "${backend_file}" || { echo "Missing ${backend_file}" >&2; exit 1; }
          test -f "${frontend_file}" || { echo "Missing ${frontend_file}" >&2; exit 1; }
          test -f "${chart_file}" || { echo "Missing ${chart_file}" >&2; exit 1; }
          grep -q "artifact_status: published" "${backend_file}" || {
            echo "Backend candidate is not published: ${{ inputs.backend_candidate_id }}" >&2
            exit 1
          }
          grep -q "artifact_status: published" "${frontend_file}" || {
            echo "Frontend candidate is not published: ${{ inputs.frontend_candidate_id }}" >&2
            exit 1
          }
          grep -q "^  status: validated$" "${chart_file}" || {
            echo "Helm candidate is not validated: ${{ inputs.chart_candidate_id }}" >&2
            exit 1
          }
          grep -q "^candidate_id: ${{ inputs.backend_candidate_id }}$" backend/ci/releases/current/staging.yaml || {
            echo "Backend candidate is not active in staging; run activate-staging.yaml first" >&2
            exit 1
          }
          grep -q "^candidate_id: ${{ inputs.frontend_candidate_id }}$" frontend/ci/releases/current/staging.yaml || {
            echo "Frontend candidate is not active in staging; run activate-staging.yaml first" >&2
            exit 1
          }

          candidate_path="ci/releases/candidates/${{ inputs.cluster_version }}.yaml"
          test -f "${candidate_path}" || {
            echo "Missing cluster candidate: ${{ inputs.cluster_version }}" >&2
            exit 1
          }
          grep -q "^  status: not_validated$" "${candidate_path}" || {
            echo "Cluster candidate is already configured: ${{ inputs.cluster_version }}" >&2
            exit 1
          }
          chart_revision="$(python3 helm/ci/release_ledger.py resolve --candidate-id "${{ inputs.chart_candidate_id }}")"
          cat > "$RUNNER_TEMP/cluster.json" <<EOF
          {
            "backend_candidate_id": "${{ inputs.backend_candidate_id }}",
            "frontend_candidate_id": "${{ inputs.frontend_candidate_id }}",
            "chart_candidate_id": "${{ inputs.chart_candidate_id }}",
            "chart_revision": "${chart_revision}",
            "backend": {
              "apiImage": {"tag": "${{ inputs.backend_candidate_id }}"},
              "workerImage": {"tag": "${{ inputs.backend_candidate_id }}"}
            }
          }
          EOF
          python3 ci/release_ledger.py update --candidate-id "${{ inputs.cluster_version }}" --status validated --metadata "$RUNNER_TEMP/cluster.json"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "${candidate_path}"
          git commit -m "chore(candidate): record ${{ inputs.cluster_version }}"
          git push origin HEAD:main

      - name: Request staging cluster deployment
        if: ${{ inputs.operation == 'stage' }}
        run: |
          chart_revision="$(grep '^  chart_revision:' "ci/releases/candidates/${{ inputs.cluster_version }}.yaml" | awk '{print $2}')"
          k8s_live_revision="$(git rev-parse HEAD)"
          python3 ci/deployment_pointer.py update \
            --environment staging \
            --artifact cluster \
            --candidate-id "${{ inputs.cluster_version }}" \
            --k8s-live-revision "${k8s_live_revision}" \
            --chart-revision "${chart_revision}"
          git add ci/releases/current
          git commit -m "chore(staging): request ${{ inputs.cluster_version }}"
          git push origin HEAD:main

      - name: Validate staging pointer before promotion
        if: ${{ inputs.operation == 'promote' }}
        run: |
          staging_candidate="$(python3 ci/deployment_pointer.py get --environment staging --key clusterCandidateId)"
          test "${staging_candidate}" = "${{ inputs.cluster_version }}" || {
            echo "Production can only promote the cluster candidate currently selected by staging" >&2
            exit 1
          }
          test -f "ci/releases/candidates/${{ inputs.cluster_version }}.yaml" || {
            echo "Missing cluster candidate: ${{ inputs.cluster_version }}" >&2
            exit 1
          }
          cluster_backend_candidate="$(grep -E '^[[:space:]]+backend_candidate_id:' "ci/releases/candidates/${{ inputs.cluster_version }}.yaml" | awk '{print $2; exit}')"
          cluster_frontend_candidate="$(grep -E '^[[:space:]]+frontend_candidate_id:' "ci/releases/candidates/${{ inputs.cluster_version }}.yaml" | awk '{print $2; exit}')"
          test -f "backend/ci/releases/current/production.yaml" || exit 1
          test -f "frontend/ci/releases/current/production.yaml" || exit 1
          grep -q "^candidate_id: ${cluster_backend_candidate}$" backend/ci/releases/current/production.yaml || {
            echo "Backend candidate is not current in production: ${cluster_backend_candidate}" >&2
            exit 1
          }
          grep -q "^candidate_id: ${cluster_frontend_candidate}$" frontend/ci/releases/current/production.yaml || {
            echo "Frontend candidate is not current in production: ${cluster_frontend_candidate}" >&2
            exit 1
          }

      - name: Promote cluster deployment pointer
        if: ${{ inputs.operation == 'promote' }}
        run: |
          k8s_live_revision="$(python3 ci/deployment_pointer.py get --environment staging --key k8sLiveRevision)"
          chart_revision="$(python3 ci/deployment_pointer.py get --environment staging --key chartRevision)"
          python3 ci/deployment_pointer.py update \
            --environment production \
            --artifact cluster \
            --candidate-id "${{ inputs.cluster_version }}" \
            --k8s-live-revision "${k8s_live_revision}" \
            --chart-revision "${chart_revision}"
          git add ci/releases/current
          git commit -m "chore(production): request ${{ inputs.cluster_version }}"
          git push origin HEAD:main
