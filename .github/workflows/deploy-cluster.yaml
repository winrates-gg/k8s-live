name: "[MNL] Deploy Cluster Candidate"

on:
  workflow_dispatch:
    inputs:
      operation:
        description: "Create a staging cluster candidate or promote an existing one"
        required: true
        type: choice
        options:
          - stage
          - promote
      cluster_version:
        description: "Cluster candidate ID, for example cluster-v1.0.0"
        required: true
        type: string
      backend_candidate_id:
        description: "Backend candidate ID when staging, for example backend-v1.0.0"
        required: false
        type: string
      frontend_candidate_id:
        description: "Frontend candidate ID when staging, for example frontend-v1.0.0"
        required: false
        type: string
      chart_revision:
        description: "Full Helm chart repository SHA when staging"
        required: false
        type: string

concurrency:
  group: cluster-release-ledger
  cancel-in-progress: false

jobs:
  deploy:
    name: ${{ inputs.operation }} cluster candidate
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Validate inputs
        run: |
          [[ "${{ inputs.cluster_version }}" =~ ^cluster-v[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "cluster_version must look like cluster-v1.2.3" >&2
            exit 1
          }
          if [[ "${{ inputs.operation }}" == "stage" ]]; then
            [[ "${{ inputs.backend_candidate_id }}" =~ ^backend-v[0-9]+\.[0-9]+\.[0-9]+$ ]] || exit 1
            [[ "${{ inputs.frontend_candidate_id }}" =~ ^frontend-v[0-9]+\.[0-9]+\.[0-9]+$ ]] || exit 1
            [[ "${{ inputs.chart_revision }}" =~ ^[0-9a-f]{40}$ ]] || {
              echo "chart_revision must be a full Helm chart repository SHA when staging" >&2
              exit 1
            }
          fi

      - name: Create GitHub App token for release ledgers
        id: app_token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.WRGG_GITOPS_WRITE_APP_ID }}
          private-key: ${{ secrets.WRGG_GITOPS_WRITE_APP_PRIVATE_KEY }}
          owner: winrates-gg
          repositories: backend,frontend,k8s-live

      - name: Check out cluster ledger
        uses: actions/checkout@v4
        with:
          token: ${{ steps.app_token.outputs.token }}

      - name: Check out backend ledger
        uses: actions/checkout@v4
        with:
          repository: winrates-gg/backend
          ref: main
          token: ${{ steps.app_token.outputs.token }}
          path: backend

      - name: Check out frontend ledger
        uses: actions/checkout@v4
        with:
          repository: winrates-gg/frontend
          ref: main
          token: ${{ steps.app_token.outputs.token }}
          path: frontend

      - name: Create staging cluster candidate
        if: ${{ inputs.operation == 'stage' }}
        run: |
          backend_file="backend/releases/candidates/${{ inputs.backend_candidate_id }}.yaml"
          frontend_file="frontend/releases/candidates/${{ inputs.frontend_candidate_id }}.yaml"
          test -f "${backend_file}" || { echo "Missing ${backend_file}" >&2; exit 1; }
          test -f "${frontend_file}" || { echo "Missing ${frontend_file}" >&2; exit 1; }
          grep -q "artifact_status: published" "${backend_file}" || {
            echo "Backend candidate is not published: ${{ inputs.backend_candidate_id }}" >&2
            exit 1
          }
          grep -q "artifact_status: published" "${frontend_file}" || {
            echo "Frontend candidate is not published: ${{ inputs.frontend_candidate_id }}" >&2
            exit 1
          }
          grep -q "^candidate_id: ${{ inputs.frontend_candidate_id }}$" frontend/releases/current/staging.yaml || {
            echo "Frontend candidate is not active in staging; run activate-staging.yaml first" >&2
            exit 1
          }

          candidate_path="releases/candidates/${{ inputs.cluster_version }}.yaml"
          test ! -e "${candidate_path}" || {
            echo "Cluster candidate already exists: ${{ inputs.cluster_version }}" >&2
            exit 1
          }
          mkdir -p "$(dirname "${candidate_path}")"
          cat > "${candidate_path}" <<EOF
          candidate:
            id: ${{ inputs.cluster_version }}
            domain: cluster
            validation_status: validated
            source:
              repository: winrates-gg/k8s-live
              sha: ${{ github.sha }}
            chart_revision: ${{ inputs.chart_revision }}
            backend_candidate_id: ${{ inputs.backend_candidate_id }}
            frontend_candidate_id: ${{ inputs.frontend_candidate_id }}

          backend:
            apiImage:
              tag: ${{ inputs.backend_candidate_id }}
            workerImage:
              tag: ${{ inputs.backend_candidate_id }}
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "${candidate_path}"
          git commit -m "chore(candidate): record ${{ inputs.cluster_version }}"
          git push origin HEAD:main

      - name: Request staging cluster deployment
        if: ${{ inputs.operation == 'stage' }}
        run: |
          k8s_live_revision="$(git rev-parse HEAD)"
          python3 scripts/deployment_pointer.py update \
            --environment staging \
            --artifact cluster \
            --candidate-id "${{ inputs.cluster_version }}" \
            --k8s-live-revision "${k8s_live_revision}" \
            --chart-revision "${{ inputs.chart_revision }}"
          git add releases/current
          git commit -m "chore(staging): request ${{ inputs.cluster_version }}"
          git push origin HEAD:main

      - name: Validate staging pointer before promotion
        if: ${{ inputs.operation == 'promote' }}
        run: |
          staging_candidate="$(python3 scripts/deployment_pointer.py get --environment staging --key clusterCandidateId)"
          test "${staging_candidate}" = "${{ inputs.cluster_version }}" || {
            echo "Production can only promote the cluster candidate currently selected by staging" >&2
            exit 1
          }
          test -f "releases/candidates/${{ inputs.cluster_version }}.yaml" || {
            echo "Missing cluster candidate: ${{ inputs.cluster_version }}" >&2
            exit 1
          }
          cluster_backend_candidate="$(grep -E '^[[:space:]]+backend_candidate_id:' "releases/candidates/${{ inputs.cluster_version }}.yaml" | awk '{print $2; exit}')"
          cluster_frontend_candidate="$(grep -E '^[[:space:]]+frontend_candidate_id:' "releases/candidates/${{ inputs.cluster_version }}.yaml" | awk '{print $2; exit}')"
          test -f "backend/releases/current/production.yaml" || exit 1
          test -f "frontend/releases/current/production.yaml" || exit 1
          grep -q "^candidate_id: ${cluster_backend_candidate}$" backend/releases/current/production.yaml || {
            echo "Backend candidate is not current in production: ${cluster_backend_candidate}" >&2
            exit 1
          }
          grep -q "^candidate_id: ${cluster_frontend_candidate}$" frontend/releases/current/production.yaml || {
            echo "Frontend candidate is not current in production: ${cluster_frontend_candidate}" >&2
            exit 1
          }

      - name: Promote cluster deployment pointer
        if: ${{ inputs.operation == 'promote' }}
        run: |
          k8s_live_revision="$(python3 scripts/deployment_pointer.py get --environment staging --key k8sLiveRevision)"
          chart_revision="$(python3 scripts/deployment_pointer.py get --environment staging --key chartRevision)"
          python3 scripts/deployment_pointer.py update \
            --environment production \
            --artifact cluster \
            --candidate-id "${{ inputs.cluster_version }}" \
            --k8s-live-revision "${k8s_live_revision}" \
            --chart-revision "${chart_revision}"
          git add releases/current
          git commit -m "chore(production): request ${{ inputs.cluster_version }}"
          git push origin HEAD:main
