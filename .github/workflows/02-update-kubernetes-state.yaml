name: "[02 MNL MAIN] Update Kubernetes desired state"

on:
  workflow_dispatch:
    inputs:
      operation:
        description: "[REQUIRED] Operation: update selected artifacts or restore a prior cluster tag"
        required: true
        type: choice
        options:
          - update
          - rollback
        default: update
      environment:
        description: "[REQUIRED] Choice: Kubernetes environment to update"
        required: true
        type: choice
        options:
          - staging
          - production
        default: staging
      backend_release:
        description: "[UPDATE ONLY] [REQUIRED] Backend Git tag, for example backend-v1.34.8; ignored for rollback"
        required: false
        type: string
      chart_release:
        description: "[UPDATE ONLY] [REQUIRED] Helm chart Git tag, for example chart-v1.34.8; ignored for rollback"
        required: false
        type: string
      dashboard_release:
        description: "[UPDATE ONLY] [REQUIRED] Frontend Git tag for the private dashboard bundle, for example frontend-v1.34.8; ignored for rollback"
        required: false
        type: string
      rollback_tag:
        description: "[OPTIONAL] [ROLLBACK ONLY] Existing cluster-vN.N.N tag to restore; required when operation=rollback and ignored for update"
        required: false
        type: string

concurrency:
  group: k8s-live-update-state
  cancel-in-progress: false

permissions:
  contents: write
  actions: read

jobs:
  update:
    name: ${{ inputs.operation }} ${{ inputs.environment }}
    runs-on: ubuntu-latest

    outputs:
      cluster_release: ${{ steps.state.outputs.cluster_release }}

    steps:
      - name: Create repository write token
        id: write_token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.WRGG_GITOPS_WRITE_APP_ID }}
          private-key: ${{ secrets.WRGG_GITOPS_WRITE_APP_PRIVATE_KEY }}
          owner: winrates-gg
          repositories: k8s-live

      - name: Check out selected k8s-live ref
        uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ steps.write_token.outputs.token }}
          fetch-depth: 0

      - name: Create read token for tag validation
        id: read_token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.WRGG_GITOPS_READ_APP_ID }}
          private-key: ${{ secrets.WRGG_GITOPS_READ_APP_PRIVATE_KEY }}
          owner: winrates-gg
          repositories: backend,frontend,k8s-helm-charts,k8s-live

      - name: Validate selected k8s-live ref
        env:
          SOURCE_REF_TYPE: ${{ github.ref_type }}
          SOURCE_REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          [[ "$SOURCE_REF_TYPE" == "branch" && "$SOURCE_REF_NAME" == "main" ]] || {
            echo "This workflow must run from main. Select the rollback tag in rollback_tag instead." >&2
            exit 1
          }

      - name: Validate tag inputs
        if: ${{ inputs.operation == 'update' }}
        env:
          GH_TOKEN: ${{ steps.read_token.outputs.token }}
          BACKEND_RELEASE: ${{ inputs.backend_release }}
          CHART_RELEASE: ${{ inputs.chart_release }}
          DASHBOARD_RELEASE: ${{ inputs.dashboard_release }}
        run: |
          [[ "$BACKEND_RELEASE" =~ ^backend-v[0-9]{1,2}\.[0-9]{1,2}\.[0-9]{1,2}$ ]] || {
            echo "Update requires backend_release in the form backend-v1.34.8." >&2
            exit 1
          }
          [[ "$CHART_RELEASE" =~ ^chart-v[0-9]{1,2}\.[0-9]{1,2}\.[0-9]{1,2}$ ]] || {
            echo "Update requires chart_release in the form chart-v1.34.8." >&2
            exit 1
          }
          [[ "$DASHBOARD_RELEASE" =~ ^frontend-v[0-9]{1,2}\.[0-9]{1,2}\.[0-9]{1,2}$ ]] || {
            echo "Update requires dashboard_release in the form frontend-v1.34.8." >&2
            exit 1
          }
          gh api "repos/winrates-gg/backend/git/ref/tags/${BACKEND_RELEASE}" >/dev/null
          gh api "repos/winrates-gg/k8s-helm-charts/git/ref/tags/${CHART_RELEASE}" >/dev/null
          gh api "repos/winrates-gg/frontend/git/ref/tags/${DASHBOARD_RELEASE}" >/dev/null

      - name: Validate current k8s-live source
        if: ${{ inputs.operation == 'update' }}
        run: |
          kubectl kustomize apps/overlays/staging >/dev/null
          kubectl kustomize apps/overlays/production >/dev/null

      - name: Validate rollback state
        if: ${{ inputs.operation == 'rollback' }}
        env:
          CLUSTER_RELEASE: ${{ inputs.rollback_tag }}
        run: |
          [[ "$CLUSTER_RELEASE" =~ ^cluster-v[0-9]{1,2}\.[0-9]{1,2}\.[0-9]{1,2}$ ]] || {
            echo "rollback_tag must look like cluster-v1.34.8." >&2
            exit 1
          }
          git fetch origin --tags
          git rev-parse "${CLUSTER_RELEASE}^{commit}" >/dev/null
          git cat-file -e "${CLUSTER_RELEASE}:deployments/${{ inputs.environment }}.yaml"

      - name: Create environment desired state
        id: state
        env:
          OPERATION: ${{ inputs.operation }}
          ENVIRONMENT: ${{ inputs.environment }}
          BACKEND_RELEASE: ${{ inputs.backend_release }}
          CHART_RELEASE: ${{ inputs.chart_release }}
          DASHBOARD_RELEASE: ${{ inputs.dashboard_release }}
          ROLLBACK_TAG: ${{ inputs.rollback_tag }}
        run: |
          mkdir -p deployments
          if [[ "$OPERATION" == "rollback" ]]; then
            git show "${ROLLBACK_TAG}:deployments/${ENVIRONMENT}.yaml" > "deployments/${ENVIRONMENT}.yaml"
            echo "cluster_release=${ROLLBACK_TAG}" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          latest_tag="$(git tag --list 'cluster-v*' | sort -V | tail -1)"
          if [[ -z "$latest_tag" ]]; then
            major=0
            minor=0
            patch=0
          else
            IFS=. read -r major minor patch <<< "${latest_tag#cluster-v}"
          fi
          if (( major > 99 || minor > 99 || patch > 99 )); then
            echo "Latest cluster tag exceeds the two-digit version contract: ${latest_tag}" >&2
            exit 1
          fi
          if [[ "$patch" -ge 99 ]]; then
            patch=0
            if [[ "$minor" -ge 99 ]]; then
              minor=0
              major=$((major + 1))
            else
              minor=$((minor + 1))
            fi
            if (( major > 99 )); then
              echo "No two-digit cluster version remains after ${latest_tag}." >&2
              exit 1
            fi
          else
            patch=$((patch + 1))
          fi
          next_release="cluster-v${major}.${minor}.${patch}"
          cat > "deployments/${ENVIRONMENT}.yaml" <<EOF
          environment: ${ENVIRONMENT}
          k8sLiveRelease: ${next_release}
          backendRelease: ${BACKEND_RELEASE}
          chartRelease: ${CHART_RELEASE}
          dashboardRelease: ${DASHBOARD_RELEASE}
          backend:
            apiImage:
              tag: ${BACKEND_RELEASE}
            workerImage:
              tag: ${BACKEND_RELEASE}
          dashboard:
            bundleTag: ${DASHBOARD_RELEASE}
          EOF
          echo "cluster_release=${next_release}" >> "$GITHUB_OUTPUT"

      - name: Validate generated desired state
        env:
          ENVIRONMENT: ${{ inputs.environment }}
          OPERATION: ${{ inputs.operation }}
          BACKEND_RELEASE: ${{ inputs.backend_release }}
          CHART_RELEASE: ${{ inputs.chart_release }}
          DASHBOARD_RELEASE: ${{ inputs.dashboard_release }}
        run: |
          state_file="deployments/${ENVIRONMENT}.yaml"
          test -s "$state_file" || {
            echo "Missing generated deployment state: ${state_file}" >&2
            exit 1
          }
          grep -Eq "^environment: ${ENVIRONMENT}$" "$state_file" || exit 1
          grep -Eq '^k8sLiveRelease: cluster-v[0-9]{1,2}\.[0-9]{1,2}\.[0-9]{1,2}$' "$state_file" || exit 1
          if [[ "$OPERATION" == "update" ]]; then
            grep -Eq "^backendRelease: ${BACKEND_RELEASE}$" "$state_file" || exit 1
            grep -Eq "^chartRelease: ${CHART_RELEASE}$" "$state_file" || exit 1
            grep -Eq "^dashboardRelease: ${DASHBOARD_RELEASE}$" "$state_file" || exit 1
            grep -Eq "^  bundleTag: ${DASHBOARD_RELEASE}$" "$state_file" || exit 1
          fi

      - name: Print desired-state tag context
        env:
          OPERATION: ${{ inputs.operation }}
          ENVIRONMENT: ${{ inputs.environment }}
          CLUSTER_RELEASE: ${{ steps.state.outputs.cluster_release }}
          BACKEND_RELEASE: ${{ inputs.backend_release }}
          CHART_RELEASE: ${{ inputs.chart_release }}
          DASHBOARD_RELEASE: ${{ inputs.dashboard_release }}
        run: |
          latest_tag="$(git tag --list 'cluster-v*' | sort -V | tail -1)"
          echo "Latest cluster tag: ${latest_tag:-none}"
          echo "Selected cluster tag: ${CLUSTER_RELEASE}"
          echo "Operation: ${OPERATION}"
          echo "Environment: ${ENVIRONMENT}"
          if [[ "$OPERATION" == "update" ]]; then
            echo "Backend tag: ${BACKEND_RELEASE}"
            echo "Helm chart tag: ${CHART_RELEASE}"
            echo "Dashboard bundle tag: ${DASHBOARD_RELEASE}"
          else
            echo "Rollback tag: ${CLUSTER_RELEASE}"
          fi

      - name: Commit and publish desired state
        env:
          OPERATION: ${{ inputs.operation }}
          ENVIRONMENT: ${{ inputs.environment }}
          CLUSTER_RELEASE: ${{ steps.state.outputs.cluster_release }}
          GH_TOKEN: ${{ steps.write_token.outputs.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "deployments/${ENVIRONMENT}.yaml"
          if git diff --cached --quiet; then
            echo "Desired state is already current."
          else
            git commit -m "update(${ENVIRONMENT}): ${CLUSTER_RELEASE}"
          fi
          if [[ "$OPERATION" == "update" ]]; then
            if git show-ref --tags --verify --quiet "refs/tags/${CLUSTER_RELEASE}"; then
              [[ "$(git rev-list -n 1 "${CLUSTER_RELEASE}")" == "$(git rev-parse HEAD)" ]] || {
                echo "${CLUSTER_RELEASE} already exists on a different commit." >&2
                exit 1
              }
            else
              git tag "${CLUSTER_RELEASE}"
            fi
            commit_sha="$(git rev-parse HEAD)"
            git push origin HEAD:main "refs/tags/${CLUSTER_RELEASE}"
            if ! gh release view "$CLUSTER_RELEASE" >/dev/null 2>&1; then
              gh release create "$CLUSTER_RELEASE" \
                --target "$commit_sha" \
                --title "$CLUSTER_RELEASE" \
                --generate-notes \
                --notes "Kubernetes desired state for ${ENVIRONMENT}."
            fi
          else
            git push origin HEAD:main
          fi

  result:
    name: Updated ${{ needs.update.outputs.cluster_release }}
    needs: update
    runs-on: ubuntu-latest

    steps:
      - name: Show desired-state result
        env:
          CLUSTER_RELEASE: ${{ needs.update.outputs.cluster_release }}
          ENVIRONMENT: ${{ inputs.environment }}
          OPERATION: ${{ inputs.operation }}
          DASHBOARD_RELEASE: ${{ inputs.dashboard_release }}
        run: |
          {
            echo "## Kubernetes desired-state update"
            echo "- Cluster tag: ${CLUSTER_RELEASE}"
            echo "- Environment: ${ENVIRONMENT}"
            echo "- Operation: ${OPERATION}"
            if [[ "$OPERATION" == "update" ]]; then
              echo "- Dashboard bundle: ${DASHBOARD_RELEASE}"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
