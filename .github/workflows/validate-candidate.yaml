name: "[AUTO] Validate Cluster Candidate"

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      candidate_id:
        description: "Optional cluster candidate to retry, for example cluster-v0.0.1"
        required: false
        type: string

concurrency:
  group: cluster-release-ledger
  cancel-in-progress: false

jobs:
  validate:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Record candidate for this push
        if: ${{ github.event_name == 'push' }}
        id: record
        run: |
          candidate_id="$(python3 ci/release_ledger.py record --source-sha "$GITHUB_SHA")"
          echo "candidate_id=${candidate_id}" >> "$GITHUB_OUTPUT"

      - name: Commit candidate record
        if: ${{ github.event_name == 'push' }}
        run: |
          git fetch origin main
          git rebase origin/main
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ci/releases/candidates
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore(candidate): record ${{ steps.record.outputs.candidate_id }} [skip ci]"
          git push origin HEAD:main

      - name: Resolve candidate source revision
        id: candidate
        env:
          REQUESTED_CANDIDATE_ID: ${{ inputs.candidate_id }}
          RECORDED_CANDIDATE_ID: ${{ steps.record.outputs.candidate_id }}
        run: |
          candidate_id="$REQUESTED_CANDIDATE_ID"
          [[ -n "$candidate_id" ]] || candidate_id="$RECORDED_CANDIDATE_ID"
          [[ "$candidate_id" =~ ^cluster-v[0-9]+\.[0-9]+\.[0-9]+$ ]] || exit 1
          grep -Eq '^  status: (not_validated|failed)$' "ci/releases/candidates/${candidate_id}.yaml"
          source_sha="$(python3 ci/release_ledger.py resolve --candidate-id "$candidate_id")"
          echo "candidate_id=${candidate_id}" >> "$GITHUB_OUTPUT"
          echo "source_sha=${source_sha}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.candidate.outputs.source_sha }}
          path: source

      - name: Validate staging and production overlays
        working-directory: source
        run: |
          kubectl kustomize apps/overlays/staging >/dev/null
          kubectl kustomize apps/overlays/production >/dev/null

      - name: Mark candidate validation result
        if: ${{ always() }}
        env:
          CANDIDATE_ID: ${{ steps.candidate.outputs.candidate_id }}
          VALIDATION_RESULT: ${{ job.status }}
        run: |
          test -n "$CANDIDATE_ID" || exit 1
          status=validated
          [[ "$VALIDATION_RESULT" != "success" ]] && status=failed
          python3 ci/release_ledger.py update --candidate-id "$CANDIDATE_ID" --status "$status"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "ci/releases/candidates/${CANDIDATE_ID}.yaml"
          git diff --cached --quiet || {
            git commit -m "chore(candidate): ${status} ${CANDIDATE_ID} [skip ci]"
            git push origin HEAD:main
          }
          [[ "$status" == "validated" ]]
