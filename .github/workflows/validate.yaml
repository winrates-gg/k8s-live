name: "[01 AUTO COMMIT] Validate Kubernetes live configuration"

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: k8s-live-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate Argo overlays
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Print release context
        run: |
          latest_tag="$(git ls-remote --tags origin 'refs/tags/cluster-v*' | awk -F/ '{sub(/\^\{\}$/, "", $3); print $3}' | sort -Vu | tail -1)"
          echo "Latest cluster release tag: ${latest_tag:-none}"
          echo "Validation SHA: ${GITHUB_SHA}"

      - name: Render staging overlay
        run: kubectl kustomize apps/overlays/staging >/dev/null

      - name: Render production overlay
        run: kubectl kustomize apps/overlays/production >/dev/null
