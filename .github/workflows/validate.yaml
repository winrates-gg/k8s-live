name: "[AUTO] Validate Kubernetes live configuration"

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: k8s-live-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate Argo overlays
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Render staging overlay
        run: kubectl kustomize apps/overlays/staging >/dev/null

      - name: Render production overlay
        run: kubectl kustomize apps/overlays/production >/dev/null
