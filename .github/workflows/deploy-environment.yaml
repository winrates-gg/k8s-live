name: "[MNL] Deploy Kubernetes environment"

on:
  workflow_dispatch:
    inputs:
      operation:
        description: "[REQUIRED] Choice: deploy (requires backend + chart tags) or rollback (requires a cluster tag)"
        required: true
        type: choice
        options:
          - deploy
          - rollback
        default: deploy
      environment:
        description: "[REQUIRED] Choice: Kubernetes environment to update"
        required: true
        type: choice
        options:
          - staging
          - production
        default: staging
      backend_release:
        description: "[REQUIRED FOR DEPLOY] String: backend GitHub Release tag, for example backend-v0.0.8; leave blank for rollback"
        required: false
        type: string
      chart_release:
        description: "[REQUIRED FOR DEPLOY] String: Helm chart GitHub Release tag, for example chart-v0.0.8; leave blank for rollback"
        required: false
        type: string
      cluster_release:
        description: "[REQUIRED FOR ROLLBACK] String: existing k8s-live GitHub Release tag, for example cluster-v0.0.8; leave blank for deploy"
        required: false
        type: string

concurrency:
  group: k8s-live-deploy
  cancel-in-progress: false

permissions:
  contents: write
  actions: read

jobs:
  deploy:
    name: ${{ inputs.operation }} ${{ inputs.environment }}
    runs-on: ubuntu-latest

    steps:
      - name: Check out k8s-live main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create read token for release validation
        id: read_token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.WRGG_GITOPS_READ_APP_ID }}
          private-key: ${{ secrets.WRGG_GITOPS_READ_APP_PRIVATE_KEY }}
          owner: winrates-gg
          repositories: backend,k8s-helm-charts,k8s-live

      - name: Validate release inputs
        if: ${{ inputs.operation == 'deploy' }}
        env:
          GH_TOKEN: ${{ steps.read_token.outputs.token }}
          BACKEND_RELEASE: ${{ inputs.backend_release }}
          CHART_RELEASE: ${{ inputs.chart_release }}
        run: |
          [[ "$BACKEND_RELEASE" =~ ^backend-v[0-9]+\.[0-9]+\.[0-9]{1,2}$ ]] || {
            echo "Deploy requires backend_release in the form backend-v0.0.8." >&2
            exit 1
          }
          [[ "$CHART_RELEASE" =~ ^chart-v[0-9]+\.[0-9]+\.[0-9]{1,2}$ ]] || {
            echo "Deploy requires chart_release in the form chart-v0.0.8." >&2
            exit 1
          }
          gh release view "$BACKEND_RELEASE" --repo winrates-gg/backend >/dev/null
          gh release view "$CHART_RELEASE" --repo winrates-gg/k8s-helm-charts >/dev/null

      - name: Validate current k8s-live source
        if: ${{ inputs.operation == 'deploy' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          successful_runs="$(gh run list --repo winrates-gg/k8s-live --workflow validate.yaml --commit "$GITHUB_SHA" --json conclusion --jq '[.[] | select(.conclusion == "success")] | length')"
          [[ "$successful_runs" -gt 0 ]] || {
            echo "The current k8s-live commit has no successful validation run." >&2
            exit 1
          }

      - name: Validate rollback release
        if: ${{ inputs.operation == 'rollback' }}
        env:
          GH_TOKEN: ${{ steps.read_token.outputs.token }}
          CLUSTER_RELEASE: ${{ inputs.cluster_release }}
        run: |
          [[ "$CLUSTER_RELEASE" =~ ^cluster-v[0-9]+\.[0-9]+\.[0-9]{1,2}$ ]] || {
            echo "Rollback requires cluster_release in the form cluster-v0.0.8." >&2
            exit 1
          }
          gh release view "$CLUSTER_RELEASE" --repo winrates-gg/k8s-live >/dev/null
          git cat-file -e "${CLUSTER_RELEASE}:deployments/${{ inputs.environment }}.yaml"

      - name: Create deployment state
        id: state
        env:
          OPERATION: ${{ inputs.operation }}
          ENVIRONMENT: ${{ inputs.environment }}
          BACKEND_RELEASE: ${{ inputs.backend_release }}
          CHART_RELEASE: ${{ inputs.chart_release }}
          CLUSTER_RELEASE: ${{ inputs.cluster_release }}
        run: |
          mkdir -p deployments
          if [[ "$OPERATION" == "rollback" ]]; then
            git show "${CLUSTER_RELEASE}:deployments/${ENVIRONMENT}.yaml" > "deployments/${ENVIRONMENT}.yaml"
            echo "cluster_release=${CLUSTER_RELEASE}" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          latest_tag="$(git tag --list 'cluster-v*' | sort -V | tail -1)"
          if [[ -z "$latest_tag" ]]; then
            major=0
            minor=0
            patch=0
          else
            IFS=. read -r major minor patch <<< "${latest_tag#cluster-v}"
          fi
          if [[ "$patch" -ge 99 ]]; then
            minor=$((minor + 1))
            patch=0
          else
            patch=$((patch + 1))
          fi
          next_release="cluster-v${major}.${minor}.${patch}"
          cat > "deployments/${ENVIRONMENT}.yaml" <<EOF
          environment: ${ENVIRONMENT}
          k8sLiveRelease: ${next_release}
          backendRelease: ${BACKEND_RELEASE}
          chartRelease: ${CHART_RELEASE}
          backend:
            apiImage:
              tag: ${BACKEND_RELEASE}
            workerImage:
              tag: ${BACKEND_RELEASE}
          EOF
          echo "cluster_release=${next_release}" >> "$GITHUB_OUTPUT"

      - name: Print deployment release context
        env:
          OPERATION: ${{ inputs.operation }}
          ENVIRONMENT: ${{ inputs.environment }}
          CLUSTER_RELEASE: ${{ steps.state.outputs.cluster_release }}
          BACKEND_RELEASE: ${{ inputs.backend_release }}
          CHART_RELEASE: ${{ inputs.chart_release }}
        run: |
          latest_tag="$(git tag --list 'cluster-v*' | sort -V | tail -1)"
          echo "Latest cluster release tag: ${latest_tag:-none}"
          echo "Selected cluster release tag: ${CLUSTER_RELEASE}"
          echo "Operation: ${OPERATION}"
          echo "Environment: ${ENVIRONMENT}"
          if [[ "$OPERATION" == "deploy" ]]; then
            echo "Backend release tag: ${BACKEND_RELEASE}"
            echo "Helm chart release tag: ${CHART_RELEASE}"
          fi

      - name: Commit and publish deployment state
        env:
          OPERATION: ${{ inputs.operation }}
          ENVIRONMENT: ${{ inputs.environment }}
          CLUSTER_RELEASE: ${{ steps.state.outputs.cluster_release }}
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "deployments/${ENVIRONMENT}.yaml"
          if git diff --cached --quiet; then
            echo "Deployment state is already current."
          else
            git commit -m "deploy(${ENVIRONMENT}): ${CLUSTER_RELEASE}"
          fi
          if [[ "$OPERATION" == "deploy" ]]; then
            if git show-ref --tags --verify --quiet "refs/tags/${CLUSTER_RELEASE}"; then
              [[ "$(git rev-list -n 1 "${CLUSTER_RELEASE}")" == "$(git rev-parse HEAD)" ]] || {
                echo "${CLUSTER_RELEASE} already exists on a different commit." >&2
                exit 1
              }
            else
              git tag "${CLUSTER_RELEASE}"
            fi
            git push origin HEAD:main "refs/tags/${CLUSTER_RELEASE}"
            if ! gh release view "$CLUSTER_RELEASE" >/dev/null 2>&1; then
              gh release create "$CLUSTER_RELEASE" \
                --target "$CLUSTER_RELEASE" \
                --title "$CLUSTER_RELEASE" \
                --generate-notes \
                --notes "Kubernetes desired state for ${ENVIRONMENT}."
            fi
          else
            git push origin HEAD:main
          fi
